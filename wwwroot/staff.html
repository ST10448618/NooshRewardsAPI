<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noosh Rewards — Staff Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; background: #111; color: white; }
        h1 { font-size: 1.4rem; text-align: center; }
        #reader { width: 100%; border: 3px solid #FFC72C; border-radius: 12px; overflow: hidden; margin-top: 1rem; }
        .status { padding: 1rem; border-radius: 8px; margin-top: 1rem; font-weight: bold; text-align: center; font-size: 1.1rem; }
        .status.success { background: #1a5c1a; }
        .status.error { background: #a30000; }
        .progress-text { text-align: center; font-size: 1.3rem; margin-top: 0.5rem; }
        button { width: 100%; padding: 0.8rem; margin-top: 1rem; background: #FFC72C; color: #111; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .manual-entry { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #444; }
        .manual-entry input { width: 100%; padding: 0.6rem; border-radius: 6px; border: none; box-sizing: border-box; margin-bottom: 0.5rem; }
        .pin-banner { background: #222; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.85rem; color: #aaa; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <h1>📷 Noosh Rewards — Staff Scanner</h1>
    <div id="reader"></div>
    <div id="statusBox"></div>
    <div class="pin-banner" id="pinBanner">Staff PIN not entered yet</div>

    <div class="manual-entry">
        <p style="font-size:0.85rem;color:#aaa;">Camera not working? Paste the token manually:</p>
        <input type="text" id="manualToken" placeholder="Paste QR token here" />
        <button id="manualScanBtn">Submit Token</button>
    </div>

    <script>
        const API_BASE = 'http://localhost:5148'; // ⚠ update to match your actual dotnet run URL

        const statusBox = document.getElementById('statusBox');
        const pinBanner = document.getElementById('pinBanner');
        let isProcessing = false;

        // Ask for the PIN once, up front, before the scanner even starts.
        let staffPin = prompt("Enter staff PIN:");
        pinBanner.textContent = staffPin ? "Staff PIN entered — ready to scan" : "⚠ No PIN entered — scans will fail";

        function showStatus(result) {
            const cls = result.success ? 'success' : 'error';
            let html = `<div class="status ${cls}">${result.message}</div>`;
            if (result.success && typeof result.currentPunches === 'number') {
                html += `<div class="progress-text">${result.currentPunches} / ${result.requiredPunches}</div>`;
            }
            statusBox.innerHTML = html;
        }

        async function submitToken(token) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                const res = await fetch(`${API_BASE}/api/rewards/scan`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Staff-Pin': staffPin
                    },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();

                if (res.status === 401) {
                    showStatus({ success: false, message: data.message || 'Invalid staff PIN.' });
                } else {
                    showStatus(data);
                }
            } catch (err) {
                statusBox.innerHTML = `<div class="status error">Network error: ${err.message}</div>`;
            }

            setTimeout(() => { isProcessing = false; }, 2500); // brief cooldown before next scan
        }

        const scanner = new Html5Qrcode("reader");
        scanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            (decodedText) => submitToken(decodedText),
            (errorMessage) => { /* ignore per-frame scan misses */ }
        ).catch(err => {
            statusBox.innerHTML = `<div class="status error">Camera unavailable: ${err}. Use manual entry below.</div>`;
        });

        document.getElementById('manualScanBtn').addEventListener('click', () => {
            const token = document.getElementById('manualToken').value.trim();
            if (token) submitToken(token);
        });
    </script>
</body>
</html>
